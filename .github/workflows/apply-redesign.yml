
name: Apply FARTU MASTI redesign

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout appjet
        uses: actions/checkout@v4
        with:
          ref: appjet
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply redesign patch
        run: |
          git am --3way --keep-cr redesign-fartu-masti.patch

      - name: Push redesign
        run: |
          git push origin HEAD:appjet
